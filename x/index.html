<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DooSpend — โหลดบน App Store</title>
<!-- ลิงก์สั้นสำหรับ X: doospend.com/x → App Store พร้อม campaign token ct=xbio
     มีไว้เพราะ (1) วางในทวีต/ไบโอ X ได้สั้น ๆ (2) ยังวัดได้ว่ายอดโหลดมาจาก X
     App Store Analytics จะรายงาน Campaign = xbio ให้ในรายงาน App Downloads Detailed -->
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/th/app/id6774424817?ct=xbio">
<link rel="canonical" href="https://apps.apple.com/th/app/id6774424817">
<style>
  body { font-family: -apple-system, "Noto Sans Thai", system-ui, sans-serif; background: #f6f6f5; color: #121211;
         display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
  .box { max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 19px; margin: 14px 0 6px; }
  p { color: #55554f; font-size: 14px; margin: 0 0 18px; }
  a.btn { display: inline-block; background: #121211; color: #fff; text-decoration: none;
          padding: 11px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
  <div class="box">
    <img src="../icon-180.png" alt="DooSpend">
    <h1>กำลังพาไป App Store…</h1>
    <p>ถ้าไม่เด้งเอง กดปุ่มด้านล่างได้เลย</p>
    <a class="btn" href="https://apps.apple.com/th/app/id6774424817?ct=xbio">เปิด App Store</a>
  </div>
  <script>location.replace("https://apps.apple.com/th/app/id6774424817?ct=xbio");</script>
</body>
</html>
